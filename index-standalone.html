<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blockchain Selector App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @font-face {
      font-family: 'ABC Favorit';
      src: url('font/ABCFavorit-Regular.woff') format('woff');
      font-weight: normal;
      font-style: normal;
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
    }
    
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
        'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      background: white;
    }
    
    #root {
      width: 100%;
      min-height: 100vh;
    }
    
    h1 {
      font-family: 'ABC Favorit', sans-serif;
    }
    
    button {
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    
    button:focus {
      outline: none;
    }
    
    button p {
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
      pointer-events: none;
    }
    
    ::selection {
      background: transparent;
    }
    
    ::-moz-selection {
      background: transparent;
    }
    
    * {
      -webkit-tap-highlight-color: transparent;
    }
    
    /* App Container */
    .app-container {
      background-color: white;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      position: relative;
      width: 100%;
      min-height: 100vh;
    }
    
    /* Navigation Bar */
    .nav-bar {
      border-bottom: 2px solid rgba(0, 0, 0, 0.08);
      display: flex;
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      align-items: center;
      justify-content: space-between;
      line-height: 1.5;
      font-size: 14px;
      letter-spacing: -0.14px;
      width: 100%;
    }
    
    .nav-item {
      display: flex;
      flex: 1 0 0;
      gap: 12px;
      align-items: center;
      justify-content: center;
      padding: 16px 20px;
      color: #505454;
      opacity: 0.5;
    }
    
    .nav-item.active {
      border-bottom: 2px solid #4c48ff;
      color: #4c48ff;
      margin-bottom: -2px;
      opacity: 1;
    }
    
    .nav-item p {
      font-size: 14px;
    }
    
    /* Main Content */
    .main-content {
      display: flex;
      flex-direction: column;
      gap: 36px;
      align-items: flex-start;
      padding: 40px 48px;
      width: 100%;
      flex: 1;
    }
    
    .content-header {
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: flex-start;
      width: 100%;
    }
    
    .content-title {
      font-family: 'ABC Favorit', sans-serif;
      line-height: 1.1;
      color: #111;
      font-size: 38px;
      letter-spacing: -1.9px;
      width: 100%;
      font-weight: 400;
    }
    
    .content-description {
      font-family: 'Inter', sans-serif;
      font-weight: 400;
      line-height: 1.5;
      color: #505454;
      font-size: 16px;
      letter-spacing: -0.16px;
      width: 100%;
    }
    
    /* Cards Container */
    .cards-container {
      display: flex;
      flex-direction: column;
      gap: 24px;
      align-items: flex-start;
      width: 100%;
    }
    
    .card-row {
      display: flex;
      gap: 24px;
      align-items: center;
      width: 100%;
    }
    
    .use-case-card {
      background-color: rgba(178, 183, 188, 0.4);
      display: flex;
      flex: 1 0 0;
      flex-direction: row;
      gap: 4px;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px 12px 16px;
      height: 70px;
      border-radius: 12px;
      border: 2px solid transparent;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .use-case-card:hover {
      background-color: rgba(178, 183, 188, 0.6);
    }
    
    .use-case-card.selected {
      background-color: rgba(63, 60, 255, 0.1);
      border: 2px solid #3f3cff;
    }
    
    .use-case-card-content {
      display: flex;
      flex: 1 0 0;
      flex-direction: column;
      gap: 4px;
      align-items: flex-start;
    }
    
    .use-case-title {
      font-family: 'Inter', sans-serif;
      font-weight: 500;
      line-height: normal;
      font-size: 18px;
      color: black;
      width: 100%;
      text-align: left;
    }
    
    .use-case-description {
      font-family: 'Inter', sans-serif;
      font-weight: 400;
      line-height: 20px;
      font-size: 14px;
      color: rgba(0, 0, 0, 0.6);
      width: 100%;
      text-align: left;
    }
    
    .check-icon-container {
      overflow: hidden;
      position: relative;
      width: 32px;
      height: 32px;
      flex-shrink: 0;
      opacity: 0;
      transition: opacity 0.2s;
      pointer-events: none;
    }
    
    .check-icon-container.visible {
      opacity: 1;
      pointer-events: auto;
    }
    
    .check-icon {
      display: block;
      width: 100%;
      height: 100%;
    }
    
    /* Footer */
    .footer {
      border-top: 2px solid rgba(0, 0, 0, 0.08);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 48px;
      width: 100%;
    }
    
    .back-button {
      background-color: rgba(0, 0, 0, 0.06);
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: center;
      padding: 9px 14px 10px;
      border-radius: 100px;
      opacity: 0;
      pointer-events: none;
      border: none;
      cursor: default;
    }
    
    .back-button-icon-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .back-button-icon-rotated {
      transform: rotate(180deg);
    }
    
    .back-button-icon {
      position: relative;
      width: 18px;
      height: 18px;
    }
    
    .back-button-icon img {
      display: block;
      width: 100%;
      height: 100%;
    }
    
    .back-button-text {
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      line-height: 1.3;
      color: #111;
      font-size: 14px;
      letter-spacing: -0.28px;
    }
    
    .continue-button {
      background-color: #111;
      display: flex;
      gap: 10px;
      align-items: center;
      padding: 18px 30px;
      border-radius: 100px;
      opacity: 0.2;
      cursor: not-allowed;
      border: none;
      transition: opacity 0.2s;
    }
    
    .continue-button.enabled {
      opacity: 1;
      cursor: pointer;
    }
    
    .continue-button-text {
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      line-height: 1.5;
      font-size: 16px;
      color: white;
      letter-spacing: -0.16px;
    }
    
    .continue-button-icon {
      position: relative;
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }
    
    .continue-button-icon img {
      display: block;
      width: 100%;
      height: 100%;
    }
    
    @media (max-width: 768px) {
      .nav-item {
        flex-direction: column !important;
        gap: 4px !important;
        padding: 8px 12px !important;
        font-size: 12px !important;
        letter-spacing: -0.12px !important;
      }
      
      .nav-item p {
        font-size: 12px !important;
      }
      
      .main-content {
        padding: 40px 20px !important;
      }
      
      .cards-container {
        flex-direction: column !important;
        gap: 12px !important;
      }
      
      .card-row {
        flex-direction: column !important;
        gap: 12px !important;
      }
      
      .use-case-card {
        width: 100% !important;
        flex: none !important;
      }
      
      .footer {
        padding: 20px !important;
      }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    const imgIcon = "http://localhost:3845/assets/95a72b790f04094a347cfff6b9c2bf04c0991d53.svg";
    const imgIcon1 = "img/arrow-right.svg";
    const checkIcon = "img/check.svg";

    const useCases = [
      { id: 1, title: 'E-Commerce', description: 'Online payments' },
      { id: 2, title: 'SaaS', description: 'Subscriptions' },
      { id: 3, title: 'Remittance', description: 'Cross-border' },
      { id: 4, title: 'Payroll', description: 'Pay employees' },
      { id: 5, title: 'DeFi', description: 'Financial products' },
      { id: 6, title: 'Other', description: 'General Products' },
    ];

    function UseCase() {
      const [selectedUseCase, setSelectedUseCase] = useState(null);

      return (
        <div className="app-container">
          {/* Navigation Bar */}
          <div className="nav-bar">
            <div className="nav-item active">
              <p>①</p>
              <p><nobr>Use case</nobr></p>
            </div>
            <div className="nav-item">
              <p>②</p>
              <p>Priorities</p>
            </div>
            <div className="nav-item">
              <p>③</p>
              <p>Region</p>
            </div>
            <div className="nav-item">
              <p>④</p>
              <p>Stablecoin</p>
            </div>
            <div className="nav-item">
              <p>⑤</p>
              <p>Results</p>
            </div>
          </div>

          {/* Main Content */}
          <div className="main-content">
            <div className="content-header">
              <h1 className="content-title">
                What is your use case?
              </h1>
              <p className="content-description">
                Select the option that best describes your project
              </p>
            </div>

            {/* Use Case Cards */}
            <div className="cards-container">
              <div className="card-row">
                {useCases.slice(0, 2).map((useCase) => (
                  <button
                    key={useCase.id}
                    className={`use-case-card ${selectedUseCase === useCase.id ? 'selected' : ''}`}
                    onClick={() => setSelectedUseCase(useCase.id)}
                  >
                    <div className="use-case-card-content">
                      <p className="use-case-title">
                        {useCase.title}
                      </p>
                      <p className="use-case-description">
                        {useCase.description}
                      </p>
                    </div>
                    <div className={`check-icon-container ${selectedUseCase === useCase.id ? 'visible' : ''}`}>
                      <img 
                        alt="check" 
                        src={checkIcon} 
                        className="check-icon"
                      />
                    </div>
                  </button>
                ))}
              </div>
              <div className="card-row">
                {useCases.slice(2, 4).map((useCase) => (
                  <button
                    key={useCase.id}
                    className={`use-case-card ${selectedUseCase === useCase.id ? 'selected' : ''}`}
                    onClick={() => setSelectedUseCase(useCase.id)}
                  >
                    <div className="use-case-card-content">
                      <p className="use-case-title">
                        {useCase.title}
                      </p>
                      <p className="use-case-description">
                        {useCase.description}
                      </p>
                    </div>
                    <div className={`check-icon-container ${selectedUseCase === useCase.id ? 'visible' : ''}`}>
                      <img 
                        alt="check" 
                        src={checkIcon} 
                        className="check-icon"
                      />
                    </div>
                  </button>
                ))}
              </div>
              <div className="card-row">
                {useCases.slice(4, 6).map((useCase) => (
                  <button
                    key={useCase.id}
                    className={`use-case-card ${selectedUseCase === useCase.id ? 'selected' : ''}`}
                    onClick={() => setSelectedUseCase(useCase.id)}
                  >
                    <div className="use-case-card-content">
                      <p className="use-case-title">
                        {useCase.title}
                      </p>
                      <p className="use-case-description">
                        {useCase.description}
                      </p>
                    </div>
                    <div className={`check-icon-container ${selectedUseCase === useCase.id ? 'visible' : ''}`}>
                      <img 
                        alt="check" 
                        src={checkIcon} 
                        className="check-icon"
                      />
                    </div>
                  </button>
                ))}
              </div>
            </div>
          </div>

          {/* Footer */}
          <div className="footer">
            <button className="back-button">
              <div className="back-button-icon-wrapper">
                <div className="back-button-icon-rotated">
                  <div className="back-button-icon">
                    <img alt="" src={imgIcon} />
                  </div>
                </div>
              </div>
              <p className="back-button-text">
                Back
              </p>
            </button>
            <button 
              className={`continue-button ${selectedUseCase ? 'enabled' : ''}`}
              onClick={() => {
                if (selectedUseCase) {
                  alert('Continue clicked! Selected: ' + useCases.find(u => u.id === selectedUseCase).title);
                }
              }}
              disabled={!selectedUseCase}
            >
              <p className="continue-button-text">
                Continue
              </p>
              <div className="continue-button-icon">
                <img alt="" src={imgIcon1} />
              </div>
            </button>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<UseCase />);
  </script>
</body>
</html>
